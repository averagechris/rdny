image: nixos/unstable
arch: aarch64
# Native Linux aarch64 coverage. Browser-backed smoke remains in x86_64 CI
# until the pinned browser closure is proven reliable on SourceHut aarch64.
environment:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    extra-substituters = https://averagechris-dotfiles.cachix.org
    extra-trusted-public-keys = averagechris-dotfiles.cachix.org-1:VwJkl5dG1+xGDY5x884mH/kVwwpgwBAdBKIF3BZiia4=
sources:
  - https://git.sr.ht/~averagechris/rdny
tasks:
  - eval: |
      cd rdny
      nix eval .#packages.aarch64-linux.rdny.name
      nix eval .#packages.aarch64-linux.release-artifact.name
  - package: |
      cd rdny
      nix build .#rdny --print-build-logs
  - test: |
      cd rdny
      nix run .#ci-test
