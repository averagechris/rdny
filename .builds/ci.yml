image: nixos/unstable
arch: x86_64
# Keep this manifest lean: no image packages are needed for the generated checks.
# If packages are later required on nixos/unstable, use channel-prefixed names
# (for example, nixos.git); unprefixed names fail before tasks start.
environment:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    extra-substituters = https://averagechris-dotfiles.cachix.org
    extra-trusted-public-keys = averagechris-dotfiles.cachix.org-1:VwJkl5dG1+xGDY5x884mH/kVwwpgwBAdBKIF3BZiia4=
sources:
  - https://git.sr.ht/~averagechris/rdny
tasks:
  - fmt: |
      cd rdny
      nix run .#ci-fmt
  - clippy: |
      cd rdny
      nix run .#ci-clippy
  - test: |
      cd rdny
      nix run .#ci-test
  - audit: |
      cd rdny
      nix run .#ci-audit
  - deny: |
      cd rdny
      nix run .#ci-deny
  - machete: |
      cd rdny
      nix run .#ci-machete
  - sort: |
      cd rdny
      nix run .#ci-sort
  - package: |
      cd rdny
      nix build .#rdny --print-build-logs
  - platform-eval: |
      cd rdny
      for system in x86_64-linux aarch64-linux x86_64-darwin aarch64-darwin; do
        nix eval ".#packages.${system}.rdny.name"
        nix eval ".#packages.${system}.release-artifact.name"
      done
  - packaged-smoke: |
      cd rdny
      nix build .#rdny-bundled --out-link result-rdny-bundled --print-build-logs
      nix run .#ci-smoke -- ./result-rdny-bundled/bin/rdny
  - packaged-smoke-gate: |
      cd rdny
      nix run .#ci-smoke-gate
  - attached-cdp-smoke: |
      cd rdny
      nix build .#rdny-bundled --out-link result-rdny-bundled --print-build-logs
      nix run .#ci-smoke-attached -- ./result-rdny-bundled/bin/rdny
  - smoke-flow-test: |
      cd rdny
      nix run .#ci-smoke-flow-test
  - release-facing: |
      cd rdny
      nix run .#ci-release-facing
