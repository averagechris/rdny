[package]
name = "rdny"
version = "0.1.0"
edition = "2024"
description = "Chrome automation CLI in Rust, deeply inspired by simonw/rodney"
authors = ["Christopher Cummings"]
license = "MIT"
repository = "https://git.sr.ht/~averagechris/rdny"
homepage = "https://git.sr.ht/~averagechris/rdny"
readme = "README.md"
categories = ["command-line-utilities"]

[[bin]]
name = "rdny"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", features = ["serde"] }
tungstenite = "0.29"

[dev-dependencies]
tempfile = "3"
